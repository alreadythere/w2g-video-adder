<!DOCTYPE html>
<html>
<head>
  <title>W2G Video Adder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3367D6;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #DFF2BF;
      color: #4F8A10;
    }
    .error {
      background-color: #FFBABA;
      color: #D8000C;
    }
  </style>
</head>
<body>
  <h2>W2G Video Adder</h2>
  <div class="form-group">
    <label for="apiKey">API Key:</label>
    <input type="text" id="apiKey">
  </div>
  <div class="form-group">
    <label for="roomId">Room ID:</label>
    <input type="text" id="roomId">
  </div>
  <button id="saveButton">Save Settings</button>
  <div id="status" class="status"></div>
  <hr>
  <p>
    <small>
      Right-click on YouTube links to add them to your W2G room.
      <br>
      Room URL: <a href="#" id="roomLink" target="_blank">Open W2G Room</a>
    </small>
  </p>
  <script src="popup.js"></script>
</body>
</html>
