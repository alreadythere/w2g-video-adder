<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 system-ui, sans-serif; width: 320px; margin: 12px; color: #222; }
  .k { color: #666; }
  .v { font-family: ui-monospace, monospace; word-break: break-all; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1; }
  button { padding: 7px; font: inherit; cursor: pointer; }
  #msg { margin-top: 8px; font-size: 12px; }
  h2 { font-size: 13px; margin: 14px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 a { font-weight: 400; font-size: 12px; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; }
  li { padding: 6px 0; border-top: 1px solid #eee; }
  li .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #111; text-decoration: none; }
  li .t:hover { text-decoration: underline; }
  li .m { color: #777; font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; }
  li .m { gap: 6px; }
  li .m > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .m > span:last-child { flex-shrink: 0; white-space: nowrap; }
  li .m button { padding: 1px 6px; font-size: 11px; margin-left: 4px; }
  .empty { color: #888; font-size: 12px; }
  a { color: #1565c0; cursor: pointer; }
  footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 12px; color: #777; }
</style>
</head>
<body>
  <div><span class="k">Target room:</span> <span id="room" class="v">checking…</span></div>
  <div class="k" id="src"></div>
  <div class="row">
    <button id="add" disabled>+ Add to playlist</button>
    <button id="play" disabled>▶ Play now</button>
  </div>
  <div id="msg"></div>

  <h2>Recent <a id="clear">Clear</a></h2>
  <ul id="history"></ul>

  <footer>
    <span id="version"></span>
    <span><a id="shortcuts">Shortcuts</a> · <a id="opts">Options</a></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
